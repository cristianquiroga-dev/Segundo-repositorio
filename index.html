<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina basica</title>
</head>
<body>
    <h1>Calculadora</h1>
    <img id="imagen" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0UfANVZwntxzqedBmkkGcKRSoNMqJ5zhR8HZnLkr2_g&s=10" alt="operac" width="250px">
    <div>
        <label for="num1">Ingresa el primer numero</label>
        <input type="number" required id="num1">
    </div>   
    <div>
        <label for="num2">Ingresa el segundo numero</label>
        <input type="number" required id="num2">
    </div>
    <label for="operaciones">Seleccione la opcion que desea realizar</label>
    <select id="operaciones">
        <option value="">Seleccione la operacion</option>
        <option value="suma">Suma</option>
        <option value="resta">Resta</option>
        <option value="multiplicacion">Multiplicación</option>
        <option value="division">División</option>
    </select>
    <p id="salida"></p>

    <button id="resultado">Resultado</button>

    <script src="js/app.js"></script>
</body>
</html>
